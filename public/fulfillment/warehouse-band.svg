<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Illustration: Blick in eine Lagerhalle mit Hochregalen">
  <defs>
    <linearGradient id="wb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#F0E8D8"/>
    </linearGradient>
    <linearGradient id="wb-box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9DFC9"/>
      <stop offset="1" stop-color="#D5C4A1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" fill="url(#wb-bg)"/>

  <!-- perspective floor lines -->
  <g stroke="#D8C9A9" stroke-width="2" opacity="0.7">
    <line x1="600" y1="150" x2="120" y2="380"/>
    <line x1="600" y1="150" x2="1080" y2="380"/>
    <line x1="600" y1="150" x2="360" y2="380"/>
    <line x1="600" y1="150" x2="840" y2="380"/>
  </g>
  <line x1="0" y1="150" x2="1200" y2="150" stroke="#D8C9A9" stroke-width="2"/>

  <!-- left racking -->
  <g>
    <rect x="60" y="70" width="240" height="230" fill="none" stroke="#B9A97F" stroke-width="6"/>
    <line x1="60" y1="150" x2="300" y2="150" stroke="#B9A97F" stroke-width="6"/>
    <line x1="60" y1="228" x2="300" y2="228" stroke="#B9A97F" stroke-width="6"/>
    <rect x="80" y="92" width="46" height="46" rx="3" fill="url(#wb-box)"/>
    <rect x="134" y="96" width="42" height="42" rx="3" fill="url(#wb-box)"/>
    <rect x="196" y="90" width="52" height="48" rx="3" fill="url(#wb-box)"/>
    <rect x="84" y="168" width="60" height="50" rx="3" fill="url(#wb-box)"/>
    <rect x="176" y="170" width="90" height="48" rx="3" fill="url(#wb-box)"/>
    <rect x="90" y="246" width="70" height="44" rx="3" fill="url(#wb-box)"/>
    <rect x="180" y="248" width="86" height="42" rx="3" fill="url(#wb-box)"/>
  </g>

  <!-- right racking -->
  <g>
    <rect x="900" y="70" width="240" height="230" fill="none" stroke="#B9A97F" stroke-width="6"/>
    <line x1="900" y1="150" x2="1140" y2="150" stroke="#B9A97F" stroke-width="6"/>
    <line x1="900" y1="228" x2="1140" y2="228" stroke="#B9A97F" stroke-width="6"/>
    <rect x="920" y="92" width="52" height="46" rx="3" fill="url(#wb-box)"/>
    <rect x="982" y="96" width="42" height="42" rx="3" fill="url(#wb-box)"/>
    <rect x="1040" y="90" width="60" height="48" rx="3" fill="url(#wb-box)"/>
    <rect x="924" y="168" width="88" height="50" rx="3" fill="url(#wb-box)"/>
    <rect x="1024" y="170" width="70" height="48" rx="3" fill="url(#wb-box)"/>
    <rect x="930" y="246" width="80" height="44" rx="3" fill="url(#wb-box)"/>
    <rect x="1024" y="248" width="76" height="42" rx="3" fill="url(#wb-box)"/>
  </g>

  <!-- centre pallet -->
  <g>
    <rect x="546" y="196" width="108" height="70" rx="5" fill="url(#wb-box)"/>
    <rect x="560" y="150" width="80" height="46" rx="5" fill="url(#wb-box)"/>
    <line x1="600" y1="196" x2="600" y2="266" stroke="#3B82F6" stroke-width="4"/>
    <line x1="600" y1="150" x2="600" y2="196" stroke="#3B82F6" stroke-width="4"/>
    <rect x="546" y="266" width="108" height="10" rx="2" fill="#B9A97F"/>
  </g>
</svg>
