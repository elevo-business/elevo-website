<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <title>Elevo OG Image – 10.000€-Webseiten für den deutschen Mittelstand</title>
  <!-- Background -->
  <rect width="1200" height="630" fill="#0D1B2A"/>
  <!-- Subtle accent shapes -->
  <circle cx="1080" cy="120" r="220" fill="#1A2D42" opacity="0.85"/>
  <circle cx="1120" cy="80" r="120" fill="#243A55" opacity="0.55"/>
  <rect x="0" y="0" width="8" height="630" fill="#3DD6C0"/>

  <!-- Logo lockup top-left -->
  <g transform="translate(72 64)">
    <!-- icon -->
    <g transform="translate(0 0)">
      <path d="M9 27 L24 12 L39 27" fill="none" stroke="#3DD6C0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 38 L24 26 L36 38" fill="none" stroke="#3DD6C0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
    </g>
    <text x="60" y="36" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.8">Elevo</text>
  </g>

  <!-- Eyebrow -->
  <text x="72" y="240" font-size="20" font-weight="600" fill="#3DD6C0" letter-spacing="3">PREMIUM WEB FÜR DEN DEUTSCHEN MITTELSTAND</text>
  <rect x="72" y="252" width="64" height="3" fill="#3DD6C0"/>

  <!-- Headline -->
  <text x="72" y="330" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="-2">10.000€-Webseiten,</text>
  <text x="72" y="410" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="-2">die <tspan fill="#3DD6C0">verkaufen</tspan>.</text>

  <!-- Sub -->
  <text x="72" y="478" font-size="26" font-weight="500" fill="#8AAFC8" letter-spacing="-0.2">Sichtbare Web-Arbeit. Messbarer Outcome. Premium für DACH-KMU.</text>

  <!-- Bottom hairline + domain -->
  <rect x="72" y="540" width="1056" height="1" fill="#243A55"/>
  <text x="72" y="582" font-size="22" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">elevo.solutions</text>
  <text x="1128" y="582" font-size="22" font-weight="500" fill="#8AAFC8" letter-spacing="0.5" text-anchor="end">Strategie-Gespräch anfragen →</text>
</svg>
