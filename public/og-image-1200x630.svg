<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <title>Elevo OG Image – Digitalisierung Mittelstand, Prozesse &amp; Webseiten</title>
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0E1A"/>
  <!-- Subtle accent shapes -->
  <circle cx="1080" cy="120" r="220" fill="#14203A" opacity="0.85"/>
  <circle cx="1120" cy="80" r="120" fill="#1E3370" opacity="0.55"/>
  <rect x="0" y="0" width="8" height="630" fill="#3B82F6"/>

  <!-- Logo lockup top-left -->
  <g transform="translate(72 64)">
    <!-- icon -->
    <g transform="translate(0 0)">
      <path d="M9 27 L24 12 L39 27" fill="none" stroke="#3B82F6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 38 L24 26 L36 38" fill="none" stroke="#3B82F6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
    </g>
    <text x="60" y="36" font-size="34" font-weight="800" fill="#E8EEF7" letter-spacing="-0.8">Elevo</text>
  </g>

  <!-- Eyebrow -->
  <text x="72" y="240" font-size="20" font-weight="600" fill="#3B82F6" letter-spacing="3">DIGITALISIERUNG DES DEUTSCHEN MITTELSTANDS</text>
  <rect x="72" y="252" width="64" height="3" fill="#3B82F6"/>

  <!-- Headline -->
  <text x="72" y="330" font-size="72" font-weight="900" fill="#E8EEF7" letter-spacing="-2">Prozesse, Pipelines</text>
  <text x="72" y="410" font-size="72" font-weight="900" fill="#E8EEF7" letter-spacing="-2">und <tspan fill="#3B82F6">Webseiten</tspan>, die zusammenarbeiten.</text>

  <!-- Sub -->
  <text x="72" y="478" font-size="24" font-weight="500" fill="#8AA0BD" letter-spacing="-0.2">Prozessautomatisierung first. Webseite als logischer Einstieg.</text>

  <!-- Bottom hairline + domain -->
  <rect x="72" y="540" width="1056" height="1" fill="#1E3370"/>
  <text x="72" y="582" font-size="22" font-weight="600" fill="#E8EEF7" letter-spacing="0.5">elevo.solutions</text>
  <text x="1128" y="582" font-size="22" font-weight="500" fill="#8AA0BD" letter-spacing="0.5" text-anchor="end">Strategie-Gespräch anfragen →</text>
</svg>
