  <!-- IT-Vertrieb text -->
  <text x="46" y="29" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" font-weight="700" fill="#E2E8F0" letter-spacing="0.3">IT-Vertrieb</text>
  <!-- GmbH label -->
  <text x="47" y="41" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.5" font-weight="400" fill="#60748B" letter-spacing="3">GmbH</text>
