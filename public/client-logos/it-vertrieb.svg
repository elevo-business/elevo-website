  <rect x="1" y="10" width="34" height="34" rx="5" fill="none" stroke="#3B82F6" stroke-width="1.25" opacity="0.55"/>
  <!-- I bar -->
  <rect x="14" y="19" width="4" height="16" rx="1" fill="#60A5FA"/>
  <!-- T crossbar -->
