<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Elevo Icon">
  <title>Elevo Icon</title>
  <!-- Upward chevron (solid) – primary mark -->
  <path d="M12 36 L32 16 L52 36" fill="none" stroke="#3DD6C0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lower chevron (echo) – implies lift / motion -->
  <path d="M16 50 L32 34 L48 50" fill="none" stroke="#3DD6C0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.40"/>
</svg>
