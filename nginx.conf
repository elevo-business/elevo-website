map $preview $preview_dir {
    galabaumueller       galabau-mueller;
    galabau-mueller      galabau-mueller;
    willi-wenzel         wenzel-maler;
    wenzel-maler         wenzel-maler;
    gruenerleben         gruener-leben;
    gruener-leben        gruener-leben;
    burkhardt-galabau    burkhardt-galabau;
    burkhardtgalabau     burkhardt-galabau;
    gartenschaefer       gartenschaefer;
    gehrke-galabau       gehrke-galabau;
    gehrkegalabau        gehrke-galabau;
    rosskopf             rosskopf;
    siegemund            siegemund;
    weis-kuechen         weis-kuechen;
    weiskuechen          weis-kuechen;
    werner-galabau       werner-galabau;
    wernergalabau        werner-galabau;
    template-demo        template-demo;
    default              $preview;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri @route;
    }

    # nginx läuft hinter Cloudflare (TLS-Termination). Bei `listen 80` würde der
    # nginx-eigene Trailing-Slash-Redirect Location: http://... setzen → http→https-
    # Roundtrip via Cloudflare (SEO-/HSTS-Risiko auf /impressum, /datenschutz).
    # Stattdessen Trailing-Slash explizit als 301 mit https zurückgeben, sonst
    # entweder Directory-Index oder .html serven, sonst 404.
    location @route {
        set $mode "";
        if ($uri !~ /$) {
            set $mode "noslash";
        }
        if (-d "$document_root$uri") {
            set $mode "${mode}_dir";
        }
        if ($mode = "noslash_dir") {
            return 301 https://$host$uri/$is_args$args;
        }
        try_files ${uri}index.html $uri.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|avif|svg|woff2|woff|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Video: HEAD/Range MUSS sauber durchgehen, sonst zeigt iOS Safari 00:00.
    # Cloudflare timeouted bei HEAD/Range (502/504) wenn es die mp4 cachen
    # will -> wir weisen CF an, nicht zu cachen. Range geht dann direkt zum
    # nginx, der 206 Partial Content liefert.
    location ~* \.(mp4|webm|mov|m4v)$ {
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=300, no-transform" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}

server {
    listen 80;
    server_name ~^(?<preview>.+)-preview\.elevo\.solutions$;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /previews/$preview_dir/index.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|avif|svg|woff2|woff|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
