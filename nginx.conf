map $preview $preview_dir {
    galabaumueller       galabau-mueller;
    galabau-mueller      galabau-mueller;
    willi-wenzel         wenzel-maler;
    wenzel-maler         wenzel-maler;
    gruenerleben         gruener-leben;
    gruener-leben        gruener-leben;
    burkhardt-galabau    burkhardt-galabau;
    burkhardtgalabau     burkhardt-galabau;
    gartenschaefer       gartenschaefer;
    gehrke-galabau       gehrke-galabau;
    gehrkegalabau        gehrke-galabau;
    rosskopf             rosskopf;
    siegemund            siegemund;
    weis-kuechen         weis-kuechen;
    weiskuechen          weis-kuechen;
    werner-galabau       werner-galabau;
    wernergalabau        werner-galabau;
    template-demo        template-demo;
    default              $preview;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(js|css|png|jpg|svg|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}

server {
    listen 80;
    server_name ~^(?<preview>.+)-preview\.elevo\.solutions$;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /previews/$preview_dir/index.html =404;
    }

    location ~* \.(js|css|png|jpg|svg|woff2|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;
}
